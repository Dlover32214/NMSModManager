<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>All Mod's Sky</title>
  <desc>Deep space, and no one in it. The orbit is still there; whatever rode it is gone.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#1C2E40" />
      <stop offset="0.55" stop-color="#12202E" />
      <stop offset="1" stop-color="#08121C" />
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00A0FF" stop-opacity="0.42" />
      <stop offset="0.5" stop-color="#00A0FF" stop-opacity="0.19" />
      <stop offset="1" stop-color="#00A0FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="planet" cx="0.34" cy="0.23" r="0.74">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="0.10" stop-color="#CDF5FF" />
      <stop offset="0.38" stop-color="#4AC6FF" />
      <stop offset="0.66" stop-color="#1E8FCC" />
      <stop offset="1" stop-color="#10507A" />
    </radialGradient>

    <radialGradient id="terminator" cx="0.78" cy="0.82" r="0.78">
      <stop offset="0.42" stop-color="#00060C" stop-opacity="0" />
      <stop offset="1" stop-color="#00060C" stop-opacity="0.34" />
    </radialGradient>

    <linearGradient id="ringFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9FE6FF" stop-opacity="0" />
      <stop offset="0.18" stop-color="#9FE6FF" stop-opacity="0.72" />
      <stop offset="0.5" stop-color="#00A0FF" stop-opacity="0.85" />
      <stop offset="0.82" stop-color="#9FE6FF" stop-opacity="0.72" />
      <stop offset="1" stop-color="#9FE6FF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- 深空底 -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)" />

  <!-- 星野：稀疏到几乎什么都没有 -->
  <g fill="#FFFFFF">
    <circle cx="176" cy="206" r="3.4" opacity="0.74" />
    <circle cx="292" cy="128" r="2.0" opacity="0.44" />
    <circle cx="770" cy="160" r="2.8" opacity="0.60" />
    <circle cx="890" cy="300" r="2.0" opacity="0.42" />
    <circle cx="116" cy="430" r="2.0" opacity="0.36" />
    <circle cx="930" cy="536" r="2.2" opacity="0.34" />
    <circle cx="148" cy="742" r="2.6" opacity="0.50" />
    <circle cx="866" cy="780" r="3.2" opacity="0.64" />
    <circle cx="238" cy="890" r="2.0" opacity="0.38" />
    <circle cx="700" cy="896" r="2.0" opacity="0.36" />
    <circle cx="424" cy="136" r="1.8" opacity="0.30" />
    <circle cx="608" cy="88" r="1.8" opacity="0.28" />
    <circle cx="840" cy="620" r="1.6" opacity="0.26" />
    <circle cx="196" cy="560" r="1.6" opacity="0.26" />
  </g>

  <!-- 行星外辉光 -->
  <circle cx="512" cy="612" r="330" fill="url(#halo)" />

  <!-- 空轨道：环还在，上面什么都没有 -->
  <g transform="rotate(-16 512 612)">
    <ellipse cx="512" cy="612" rx="372" ry="122" fill="none"
             stroke="url(#ringFade)" stroke-width="4" stroke-opacity="0.7" />
    <ellipse cx="512" cy="612" rx="316" ry="100" fill="none"
             stroke="url(#ringFade)" stroke-width="7" />
  </g>

  <!-- 行星本体 -->
  <circle cx="512" cy="612" r="214" fill="url(#planet)" />
  <circle cx="512" cy="612" r="214" fill="url(#terminator)" />

  <!-- 全息边缘 -->
  <circle cx="512" cy="612" r="214" fill="none" stroke="#D6F5FF"
          stroke-width="2.4" stroke-opacity="0.62" />

  <!-- 受光面高光 -->
  <path d="M 376 462 A 214 214 0 0 1 520 398"
        fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-opacity="0.5"
        stroke-linecap="round" />

  <!-- 边框 -->
  <rect x="1" y="1" width="1022" height="1022" rx="223"
        fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.09" />
</svg>
