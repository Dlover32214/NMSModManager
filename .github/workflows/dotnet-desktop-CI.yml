name: build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 同一分支连推时取消上一次运行，不必排队等旧的跑完。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 本工作流只读仓库：不写 issue、不推代码、不发 release。
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: build (win-x64)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    # 版本只在 global.json 里写一处，工作流不重复声明。
    - name: Install .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Prepare
      shell: pwsh
      run: |
        dotnet --info
        New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.nuget\packages" | Out-Null

    # 缓存 NuGet 全局包目录。publish -r win-x64 要拉 RID 运行时包，
    # 命中后省掉这部分下载；将来加 PackageReference 同样受益。
    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'AllModsSky.slnx') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Build
      run: dotnet build AllModsSky.slnx -c Release --nologo -v minimal -tl:off

    # PR 只验证能不能编译，不产出 exe：publish 加传 artifact 每次白花几十秒和存储。
    - name: Publish single file
      if: github.event_name == 'push'
      run: >
        dotnet publish src/AllModsSky.App/AllModsSky.App.csproj
        -c Release -r win-x64 --no-self-contained
        -p:PublishSingleFile=true
        -p:EnableCompressionInSingleFile=false
        -p:DebugType=none
        -p:PublishReadyToRun=false
        -o release/publish
        --nologo -v minimal -tl:off

    # 把体积、哈希、SDK 版本写进运行摘要，省得每次点开日志翻。
    # SHA256 和程序自己的更新校验用的是同一个算法，方便下载后人工比对。
    - name: Summarize
      if: github.event_name == 'push'
      shell: pwsh
      run: |
        $exe = Get-Item -LiteralPath 'release/publish/AllModsSky.exe'
        $mb = '{0:N2}' -f ($exe.Length / 1MB)
        $sha = (Get-FileHash -LiteralPath $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
        $sdk = (dotnet --version).Trim()
        $short = $env:GITHUB_SHA.Substring(0, 7)
        @(
          '### 构建产物'
          ''
          '- 文件：release/publish/AllModsSky.exe'
          "- 体积：$mb MB"
          "- SHA256：$sha"
          '- 目标框架：net8.0-windows'
          "- SDK：$sdk"
          "- 提交：$short"
        ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

    - name: Upload artifact
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v7
      with:
        name: AllModsSky-win-x64
        path: release/publish/AllModsSky.exe
        retention-days: 14
        if-no-files-found: error
